name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-qt:
    name: Linux Qt
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git cmake g++ qt6-base-dev libqtermwidget6-2-dev libutf8proc-dev

      - name: Configure
        run: cmake -S linux-qt -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install smoke test
        run: cmake --install build --prefix "$RUNNER_TEMP/tfx-install"
