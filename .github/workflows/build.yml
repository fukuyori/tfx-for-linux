name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-qt:
    name: Linux Qt (Rust core ${{ matrix.rust_core }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust_core: ["OFF", "ON"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev

      - name: Check Rust formatting
        if: matrix.rust_core == 'ON'
        run: cargo fmt --all --check --manifest-path rust/Cargo.toml

      - name: Lint Rust
        if: matrix.rust_core == 'ON'
        run: cargo clippy --workspace --all-targets --all-features --locked --manifest-path rust/Cargo.toml -- -D warnings

      - name: Install Rust audit tools
        if: matrix.rust_core == 'ON'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Audit Rust dependencies
        if: matrix.rust_core == 'ON'
        run: |
          cargo audit --file rust/Cargo.lock
          cargo deny --manifest-path rust/Cargo.toml --config rust/deny.toml --locked check

      - name: Configure
        run: cmake -S linux-qt -B build -DTFX_ENABLE_RUST_CORE=${{ matrix.rust_core }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install smoke test
        run: cmake --install build --prefix "$RUNNER_TEMP/tfx-install"

  linux-sanitizers:
    name: Linux Qt Rust boundary (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev

      - name: Configure
        run: >
          cmake -S linux-qt -B build-sanitize
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DTFX_ENABLE_RUST_CORE=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build Rust boundary tests
        run: >
          cmake --build build-sanitize
          --target tfx_rust_path_bridge_test tfx_type_ahead_test tfx_preview_text_test
          --parallel

      - name: Test Rust boundary with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          ctest --test-dir build-sanitize --output-on-failure
          -R "^(rust_path_bridge|type_ahead|preview_text)$"
